<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1012">
  <title>Agentic RAG · 工作台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0d1012; --panel:#121619; --panel-2:#171c1f; --panel-3:#1b2225;
      --line:rgba(231,241,238,.1); --line-strong:rgba(231,241,238,.18);
      --text:#eef4f1; --muted:#8d9a95; --subtle:#65716d; --teal:#71ded4;
      --teal-dim:rgba(113,222,212,.12); --coral:#ff917a; --green:#8ed99e;
      --yellow:#eacb7c; --danger:#ff9888; --sidebar:246px; --trace:310px;
    }
    *{box-sizing:border-box} html,body{width:100%;height:100%;overflow:hidden}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}
    button,textarea{font:inherit;letter-spacing:0}button{color:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
    .app-shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr) var(--trace);width:100%;height:100%}
    .sidebar{display:flex;flex-direction:column;min-width:0;padding:20px 15px;border-right:1px solid var(--line);background:#101416}
    .brand{display:flex;align-items:center;gap:10px;padding:0 7px 23px;font-size:15px;font-weight:720}
    .drawer-close,.trace-close{display:grid;place-items:center;margin-left:auto;width:28px;height:28px;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.drawer-close:hover,.trace-close:hover{background:var(--panel-3);color:var(--text)}
    .brand-mark{position:relative;width:26px;height:26px;border:1px solid rgba(113,222,212,.55);border-radius:6px;background:#0d1113}
    .brand-mark:before,.brand-mark:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px rgba(113,222,212,.7)}
    .brand-mark:before{top:6px;left:6px}.brand-mark:after{right:5px;bottom:5px;background:var(--coral)}
    .new-chat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border:1px solid rgba(113,222,212,.28);border-radius:6px;background:var(--teal-dim);color:var(--teal);cursor:pointer;font-size:13px;font-weight:650}
    .new-chat:hover{border-color:var(--teal);background:rgba(113,222,212,.18)}.new-chat span:first-child{font-size:18px;line-height:1}
    .section-label{margin:25px 8px 10px;color:var(--subtle);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    .conversation-list{display:flex;flex:1;flex-direction:column;gap:4px;overflow:auto}.conversation{display:block;width:100%;padding:10px 9px;border:0;border-radius:5px;background:transparent;color:#b7c1bd;cursor:pointer;font-size:12px;line-height:1.35;text-align:left}.conversation:hover,.conversation.active{background:var(--panel-3);color:var(--text)}.conversation.empty{color:var(--subtle);cursor:default}
    .sidebar-footer{display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.user-mini{display:flex;align-items:center;gap:9px;min-width:0;padding:4px 7px}.avatar{display:grid;flex:0 0 28px;place-items:center;width:28px;height:28px;border-radius:50%;background:#263437;color:var(--teal);font-size:12px;font-weight:750}.user-email{overflow:hidden;color:#b7c1bd;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.logout{width:100%;padding:8px 7px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;text-align:left}.logout:hover{color:var(--coral)}
    .main-column{display:flex;min-width:0;flex-direction:column;background:var(--bg)}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 27px;border-bottom:1px solid var(--line)}.topbar-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650}.topbar-title small{color:var(--subtle);font-size:11px;font-weight:450}.topbar-actions{display:flex;align-items:center;gap:9px}.trace-toggle,.sidebar-toggle{display:none;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}.sidebar-toggle{width:30px;height:30px;margin-right:2px}.trace-toggle{gap:5px;padding:6px 8px;font-size:11px}.trace-toggle:hover,.sidebar-toggle:hover{border-color:rgba(113,222,212,.45);color:var(--teal)}.connection{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.connection:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(142,217,158,.6)}.connection.offline:before{background:var(--danger);box-shadow:none}
    body.sidebar-collapsed .app-shell{grid-template-columns:minmax(0,1fr) var(--trace)}body.sidebar-collapsed .sidebar{display:none}body.sidebar-collapsed .sidebar-toggle{display:inline-flex}body.trace-collapsed .app-shell{grid-template-columns:var(--sidebar) minmax(0,1fr)}body.trace-collapsed .trace-panel{display:none}body.trace-collapsed .trace-toggle{display:inline-flex}body.sidebar-collapsed.trace-collapsed .app-shell{grid-template-columns:minmax(0,1fr)}
    .messages{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}.welcome{display:grid;place-items:center;min-height:100%;padding:48px 24px}.welcome-inner{width:min(640px,100%);text-align:center}.welcome-kicker{margin:0 0 13px;color:var(--teal);font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.welcome h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(35px,4vw,54px);font-weight:500;line-height:1.05}.welcome h1 span{color:var(--teal)}.welcome p{max-width:480px;margin:17px auto 27px;color:var(--muted);font-size:14px;line-height:1.7}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.suggestion{padding:9px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:#b8c4bf;cursor:pointer;font-size:12px}.suggestion:hover{border-color:rgba(113,222,212,.5);color:var(--teal)}
    .message-list{width:min(820px,calc(100% - 48px));margin:0 auto;padding:30px 0 34px}.message-row{display:flex;gap:13px;margin:0 0 27px;animation:message-in 230ms ease both}.message-row.user{justify-content:flex-end}.message-avatar{display:grid;flex:0 0 30px;place-items:center;width:30px;height:30px;border-radius:6px;background:#223337;color:var(--teal);font-size:10px;font-weight:800}.message-row.user .message-avatar{order:2;background:#3b2c2a;color:var(--coral)}.bubble{min-width:0;max-width:min(690px,calc(100% - 45px))}.message-meta{margin:0 0 6px;color:var(--subtle);font-size:10px}.message-row.user .message-meta{text-align:right}.message-content{color:#dce5e1;font-size:14px;line-height:1.75;overflow-wrap:anywhere}.message-row.user .message-content{padding:11px 14px;border:1px solid rgba(255,145,122,.18);border-radius:8px 2px 8px 8px;background:rgba(255,145,122,.075);color:#f2e7e3}.message-content h1,.message-content h2,.message-content h3{margin:16px 0 8px;color:var(--text);line-height:1.25}.message-content h1{font-size:20px}.message-content h2{font-size:17px}.message-content h3{font-size:15px}.message-content p{margin:0 0 10px}.message-content p:last-child{margin-bottom:0}.message-content ul,.message-content ol{margin:8px 0 12px;padding-left:22px}.message-content li{margin:4px 0}.message-content code{padding:2px 5px;border-radius:3px;background:#0a0d0f;color:var(--teal);font-family:"Cascadia Code",Consolas,monospace;font-size:.9em}.message-content pre{margin:12px 0;padding:13px 14px;overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:#0a0d0f}.message-content pre code{padding:0;background:none;color:#c9d6d1;white-space:pre}.message-content blockquote{margin:10px 0;padding-left:12px;border-left:2px solid var(--teal);color:var(--muted)}.streaming-cursor:after{content:"";display:inline-block;width:7px;height:16px;margin-left:4px;vertical-align:-2px;background:var(--teal);animation:blink 800ms steps(2,start) infinite}.answer-note{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:5px 8px;border-radius:4px;background:var(--teal-dim);color:var(--teal);font-size:11px}.answer-note.cautious{background:rgba(234,203,124,.1);color:var(--yellow)}.answer-note.insufficient{background:rgba(255,145,122,.1);color:var(--coral)}.sources{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.sources-title{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:#b8c5c0;font-size:11px;font-weight:700}.sources-title span{color:var(--teal)}.source-list{display:flex;flex-wrap:wrap;gap:7px}.source-card{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--muted);font-size:11px}.source-icon{color:var(--coral);font-size:13px}
    .composer-wrap{padding:0 24px 20px}.composer{width:min(820px,100%);margin:0 auto}.composer-box{display:flex;align-items:flex-end;gap:9px;padding:8px 8px 8px 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);box-shadow:0 10px 35px rgba(0,0,0,.16)}.composer-box:focus-within{border-color:rgba(113,222,212,.55)}textarea{flex:1;min-width:0;min-height:24px;max-height:150px;padding:7px 0;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;line-height:1.5}textarea::placeholder{color:var(--subtle)}.send-button,.stop-button{display:grid;flex:0 0 36px;place-items:center;width:36px;height:36px;border:0;border-radius:6px;cursor:pointer}.send-button{background:var(--teal);color:#0c1717;font-size:17px;font-weight:800}.send-button:hover:not(:disabled){background:#9af0e8}.send-button:disabled{cursor:not-allowed;opacity:.35}.stop-button{display:none;background:rgba(255,145,122,.15);color:var(--coral);font-size:15px}.composer.is-streaming .send-button{display:none}.composer.is-streaming .stop-button{display:grid}.composer-hint{margin:8px 3px 0;color:var(--subtle);font-size:10px}
    .trace-panel{min-width:0;overflow:auto;border-left:1px solid var(--line);background:#101416}.trace-header{display:flex;align-items:center;justify-content:space-between;padding:21px 18px 16px;border-bottom:1px solid var(--line)}.trace-title{font-size:13px;font-weight:700}.trace-title small{display:block;margin-top:4px;color:var(--subtle);font-size:10px;font-weight:450}.trace-refresh{border:0;background:transparent;color:var(--subtle);cursor:pointer;font-size:14px}.trace-refresh:hover{color:var(--teal)}.trace-body{padding:17px 18px 24px}.trace-empty{color:var(--subtle);font-size:12px;line-height:1.6}.trace-request{margin-bottom:17px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}.trace-request-label{color:var(--subtle);font-size:10px}.trace-request-id{display:block;margin-top:5px;color:#b9c6c1;font-family:"Cascadia Code",Consolas,monospace;font-size:10px;overflow-wrap:anywhere}.trace-grid{display:grid;gap:1px;margin-bottom:18px;border:1px solid var(--line);border-radius:5px;overflow:hidden}.trace-item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;padding:8px 10px;background:var(--panel)}.trace-item+.trace-item{border-top:1px solid var(--line)}.trace-label{color:var(--muted);font-size:11px}.trace-value{max-width:58%;color:#d8e3de;font-size:11px;font-weight:600;text-align:right;overflow-wrap:anywhere}.trace-value.good{color:var(--green)}.trace-value.warn{color:var(--yellow)}.trace-value.bad{color:var(--coral)}.trace-section-title{margin:17px 0 9px;color:var(--subtle);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.trace-sources{display:grid;gap:6px}.trace-source{padding:7px 8px;border:1px solid var(--line);border-radius:4px;color:#b8c5c0;font-size:11px;overflow-wrap:anywhere}.trace-source:before{content:"↳";margin-right:6px;color:var(--coral)}
    @keyframes message-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}
    @media(max-width:1120px){:root{--trace:270px}.sidebar{padding-left:11px;padding-right:11px}.message-list,.composer{width:min(760px,calc(100% - 32px))}}
    @media(max-width:900px){.app-shell,body.trace-collapsed .app-shell{grid-template-columns:var(--sidebar) minmax(0,1fr)}body.sidebar-collapsed .app-shell,body.sidebar-collapsed.trace-collapsed .app-shell{grid-template-columns:minmax(0,1fr)}.trace-panel{display:none}.trace-toggle{display:inline-flex}body.trace-open .trace-panel,body.trace-collapsed.trace-open .trace-panel{display:block;position:fixed;z-index:5;top:0;right:0;bottom:0;width:min(320px,88vw);box-shadow:-20px 0 45px rgba(0,0,0,.35)}}
    @media(max-width:680px){.app-shell,body.sidebar-collapsed .app-shell{grid-template-columns:minmax(0,1fr)}.sidebar,body.sidebar-collapsed .sidebar{display:none}.sidebar-toggle,body.sidebar-collapsed .sidebar-toggle{display:inline-flex;margin-right:8px}body.sidebar-open .sidebar,body.sidebar-collapsed.sidebar-open .sidebar{display:flex;position:fixed;z-index:6;top:0;bottom:0;left:0;width:min(270px,86vw);box-shadow:20px 0 45px rgba(0,0,0,.35)}.topbar{padding:0 15px}.topbar-title small,.connection{display:none}.message-list{width:calc(100% - 28px);padding-top:22px}.composer-wrap{padding:0 14px 14px}.composer{width:100%}.welcome{padding:35px 16px}.welcome p{font-size:13px}.suggestions{display:grid;grid-template-columns:1fr 1fr}.suggestion{min-height:42px;text-align:left}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Agentic RAG</span><button class="drawer-close" id="sidebar-close" type="button" title="关闭会话栏" aria-label="关闭会话栏">×</button></div>
      <button class="new-chat" id="new-chat" type="button"><span aria-hidden="true">＋</span><span>新对话</span></button>
      <div class="section-label">当前会话</div>
      <div class="conversation-list" id="conversation-list"><div class="conversation empty">还没有对话，开始一次提问吧</div></div>
      <div class="sidebar-footer"><div class="user-mini"><span class="avatar" id="avatar">A</span><span class="user-email" id="user-email">正在读取用户...</span></div><button class="logout" id="logout" type="button">↪&nbsp;&nbsp;退出登录</button></div>
    </aside>
    <main class="main-column">
      <header class="topbar"><div class="topbar-title"><button class="sidebar-toggle" id="sidebar-toggle" type="button" title="打开会话栏">☰</button><span>知识工作台</span><small>基于检索证据的智能回答</small></div><div class="topbar-actions"><span class="connection" id="connection">已连接</span><button class="trace-toggle" id="trace-toggle" type="button">⌁ Trace</button></div></header>
      <section class="messages" id="messages" aria-live="polite"><div class="welcome" id="welcome"><div class="welcome-inner"><p class="welcome-kicker">Grounded intelligence</p><h1>你好，我是 <span>Agentic RAG</span></h1><p>我会在需要时检索知识库，结合证据回答，并为你保留可追溯的来源。</p><div class="suggestions"><button class="suggestion" type="button">什么是 RAG？</button><button class="suggestion" type="button">RAG 和传统问答有什么区别？</button><button class="suggestion" type="button">为什么需要 Query Rewrite？</button><button class="suggestion" type="button">介绍一下你的回答策略</button></div></div></div><div class="message-list" id="message-list"></div></section>
      <div class="composer-wrap"><div class="composer" id="composer"><div class="composer-box"><textarea id="question" rows="1" placeholder="向 Agentic RAG 提问..." aria-label="输入问题"></textarea><button class="send-button" id="send" type="button" title="发送">↑</button><button class="stop-button" id="stop" type="button" title="停止生成">■</button></div><div class="composer-hint">Enter 发送 · Shift + Enter 换行</div></div></div>
    </main>
    <aside class="trace-panel" id="trace-panel" aria-label="Agent Trace"><div class="trace-header"><div class="trace-title">Agent Trace<small>本次请求运行详情</small></div><button class="trace-close" id="trace-close" type="button" title="关闭 Agent Trace" aria-label="关闭 Agent Trace">×</button><button class="trace-refresh" id="trace-refresh" type="button" title="刷新 Trace">↻</button></div><div class="trace-body" id="trace-body"><div class="trace-empty">发送问题后，这里会显示 Router、检索、可靠性和来源信息。</div></div></aside>
  </div>
  <script>
    (() => {
      const messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),messageList=document.getElementById('message-list'),composer=document.getElementById('composer'),question=document.getElementById('question'),send=document.getElementById('send'),stop=document.getElementById('stop'),status=document.getElementById('connection'),traceBody=document.getElementById('trace-body'),conversationList=document.getElementById('conversation-list'),sidebarEmail=document.getElementById('user-email'),avatar=document.getElementById('avatar');
      let source=null,activeAssistant=null,activeRaw='',activeConversation=null;
      const redirectToLogin=()=>{if(source)source.close();window.location.replace('/login')};
      const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const renderMarkdown=value=>{let html=escapeHtml(value),blocks=[];html=html.replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{const i=blocks.push(`<pre><code class="language-${lang||'text'}">${code.trimEnd()}</code></pre>`)-1;return `@@CODE${i}@@`});html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^(?:[-*]) (.+)$/gm,'<li>$1</li>').replace(/(<li>[^\n]+<\/li>\n?)+/g,'<ul>$&</ul>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>');html=html.split(/\n{2,}/).map(block=>/^<(h[1-3]|ul|ol|blockquote|pre)/.test(block.trim())||/^@@CODE\d+@@$/.test(block.trim())?block:(block.trim()?`<p>${block.replace(/\n/g,'<br>')}</p>`:'' )).join('');return html.replace(/@@CODE(\d+)@@/g,(_,i)=>blocks[Number(i)])};
      const splitSources=raw=>{const match=raw.match(/\n{1,3}参考来源：([\s\S]*)$/);if(!match)return{body:raw,sources:[]};const sources=match[1].split('\n').map(line=>line.replace(/^\s*\[\d+\]\s*/,'').trim()).filter(Boolean);return{body:raw.slice(0,match.index).trimEnd(),sources:[...new Set(sources)]}};
      const strategyNote=strategy=>strategy==='reliable'?['✓ 基于知识库可靠回答','reliable']:strategy==='cautious'?['⚠ 当前资料有限，以下回答仅基于现有知识库','cautious']:strategy==='insufficient'?['ⓘ 当前知识库缺少足够信息，无法可靠回答该问题','insufficient']:['',''];
      const renderSources=sources=>!sources.length?'':`<div class="sources"><div class="sources-title"><span>⌁</span>参考来源 · ${sources.length}</div><div class="source-list">${sources.map(item=>`<div class="source-card"><span class="source-icon">▧</span><span>${escapeHtml(item)}</span></div>`).join('')}</div></div>`;
      const renderAssistant=(element,raw,streaming=false,state=null)=>{const split=splitSources(raw),note=state?strategyNote(state.answer_strategy):['',''];element.querySelector('.message-content').innerHTML=renderMarkdown(split.body);element.querySelector('.message-content').classList.toggle('streaming-cursor',streaming);element.querySelector('.answer-extra').innerHTML=`${note[0]?`<div class="answer-note ${note[1]}">${note[0]}</div>`:''}${streaming?'':renderSources(split.sources)}`};
      const appendUser=text=>{welcome.style.display='none';const row=document.createElement('article');row.className='message-row user';row.innerHTML='<div class="message-avatar">YOU</div><div class="bubble"><div class="message-meta">你</div><div class="message-content"></div></div>';row.querySelector('.message-content').textContent=text;messageList.appendChild(row);messages.scrollTop=messages.scrollHeight};
      const appendAssistant=()=>{welcome.style.display='none';const row=document.createElement('article');row.className='message-row assistant';row.innerHTML='<div class="message-avatar">AI</div><div class="bubble"><div class="message-meta">Agentic RAG <span class="answer-status">生成中</span></div><div class="message-content streaming-cursor"></div><div class="answer-extra"></div></div>';messageList.appendChild(row);return row};
      const updateConversations=text=>{const title=text.length>30?`${text.slice(0,30)}…`:text;if(activeConversation)activeConversation.textContent=title;else{activeConversation=document.createElement('button');activeConversation.type='button';activeConversation.className='conversation active';activeConversation.textContent=title;conversationList.innerHTML='';conversationList.appendChild(activeConversation)}};
      const setStreaming=value=>{composer.classList.toggle('is-streaming',value);question.disabled=value;send.disabled=value;stop.disabled=!value;status.textContent=value?'生成中':'已连接';status.classList.remove('offline')};
      const renderTrace=state=>{if(!state){traceBody.innerHTML='<div class="trace-empty">发送问题后，这里会显示 Router、检索、可靠性和来源信息。</div>';return}const routing=state.routing_decision||'pending',usesKb=routing.includes('true'),reliability=state.retrieval_reliable?'Reliable':state.retrieval_result_count?'有限':'未检索',reliabilityClass=state.retrieval_reliable?'good':state.retrieval_result_count?'warn':'',strategy=state.answer_strategy||'pending',strategyLabel={reliable:'可靠回答',cautious:'谨慎回答',insufficient:'证据不足',not_needed:'无需知识库'}[strategy]||strategy,strategyClass=strategy==='reliable'?'good':strategy==='insufficient'?'bad':strategy==='cautious'?'warn':'',sources=Array.isArray(state.sources)?state.sources:[];traceBody.innerHTML=`<div class="trace-request"><span class="trace-request-label">REQUEST ID</span><span class="trace-request-id">${escapeHtml(state.request_id||'—')}</span></div><div class="trace-grid"><div class="trace-item"><span class="trace-label">Router</span><span class="trace-value ${usesKb?'good':''}">${usesKb?'使用知识库':routing==='pending'?'处理中':'直接回答'}</span></div><div class="trace-item"><span class="trace-label">检索结果</span><span class="trace-value">${state.retrieval_result_count||0} 个</span></div><div class="trace-item"><span class="trace-label">Best distance</span><span class="trace-value">${state.best_distance==null?'—':Number(state.best_distance).toFixed(3)}</span></div><div class="trace-item"><span class="trace-label">Reliability</span><span class="trace-value ${reliabilityClass}">${reliability}</span></div><div class="trace-item"><span class="trace-label">相关性判断</span><span class="trace-value">${escapeHtml(state.relevance_decision||'—')}</span></div><div class="trace-item"><span class="trace-label">Answer Strategy</span><span class="trace-value ${strategyClass}">${escapeHtml(strategyLabel)}</span></div><div class="trace-item"><span class="trace-label">Tool 调用</span><span class="trace-value">${state.tool_call_count||0} 次</span></div><div class="trace-item"><span class="trace-label">总耗时</span><span class="trace-value">${state.total_time_ms==null?'处理中':`${Number(state.total_time_ms).toFixed(1)} ms`}</span></div></div>${state.query_rewrite?`<div class="trace-section-title">Query Rewrite</div><div class="trace-request"><span class="trace-request-id">${escapeHtml(state.query_rewrite)}</span></div>`:''}${sources.length?`<div class="trace-section-title">Sources · ${sources.length}</div><div class="trace-sources">${sources.map(s=>`<div class="trace-source">${escapeHtml(s)}</div>`).join('')}</div>`:''}`};
      const fetchState=async()=>{try{const response=await fetch('/chat/state',{credentials:'same-origin'});if(response.status===401)return redirectToLogin();if(response.ok)renderTrace(await response.json())}catch(_){}};
      const stopGeneration=()=>{if(!source)return;source.close();source=null;setStreaming(false);if(activeAssistant){activeAssistant.querySelector('.message-meta').innerHTML='Agentic RAG <span class="answer-status">已停止</span>';activeAssistant.querySelector('.message-content').classList.remove('streaming-cursor');if(!activeRaw.trim())activeAssistant.remove()}activeAssistant=null;status.textContent='已停止'};
      const sendQuestion=value=>{const text=value.trim();if(!text||source)return;question.value='';question.style.height='auto';appendUser(text);updateConversations(text);activeRaw='';activeAssistant=appendAssistant();const assistantElement=activeAssistant;setStreaming(true);renderTrace(null);source=new EventSource(`/chat/stream?question=${encodeURIComponent(text)}`);source.onmessage=event=>{let payload;try{payload=JSON.parse(event.data)}catch(_){return}if(payload.type==='status'){status.textContent=payload.message||'处理中';status.classList.remove('offline')}else if(payload.type==='token'){activeRaw+=payload.content||'';renderAssistant(assistantElement,activeRaw,true);messages.scrollTop=messages.scrollHeight}else if(payload.type==='done'){source.close();source=null;setStreaming(false);assistantElement.querySelector('.message-meta').innerHTML='Agentic RAG <span class="answer-status">已完成</span>';fetch('/chat/state',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(state=>{if(state)renderAssistant(assistantElement,activeRaw,false,state);renderTrace(state)});activeAssistant=null}else if(payload.type==='error'){source.close();source=null;setStreaming(false);status.textContent='回答失败';status.classList.add('offline');assistantElement.querySelector('.message-meta').innerHTML='Agentic RAG <span class="answer-status">错误</span>';assistantElement.querySelector('.message-content').innerHTML=`<p class="answer-note insufficient">${escapeHtml(payload.message||'请求失败，请稍后重试。')}</p>`;assistantElement.querySelector('.message-content').classList.remove('streaming-cursor');activeAssistant=null;fetchState()}};source.onerror=()=>{if(!source)return;source.close();source=null;setStreaming(false);status.textContent='连接异常';status.classList.add('offline');assistantElement.querySelector('.message-meta').innerHTML='Agentic RAG <span class="answer-status">连接异常</span>';assistantElement.querySelector('.message-content').innerHTML='<p class="answer-note insufficient">无法连接到 Agent，请检查服务状态。</p>';assistantElement.querySelector('.message-content').classList.remove('streaming-cursor');activeAssistant=null}};
      send.addEventListener('click',()=>sendQuestion(question.value));stop.addEventListener('click',stopGeneration);question.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendQuestion(question.value)}});question.addEventListener('input',()=>{question.style.height='auto';question.style.height=`${Math.min(question.scrollHeight,150)}px`;send.disabled=!question.value.trim()||Boolean(source)});document.querySelectorAll('.suggestion').forEach(button=>button.addEventListener('click',()=>sendQuestion(button.textContent)));document.getElementById('new-chat').addEventListener('click',()=>{if(source)stopGeneration();messageList.innerHTML='';welcome.style.display='grid';activeConversation=null;conversationList.innerHTML='<div class="conversation empty">还没有对话，开始一次提问吧</div>';renderTrace(null);document.body.classList.remove('sidebar-open');question.focus()});document.getElementById('trace-refresh').addEventListener('click',fetchState);document.getElementById('trace-toggle').addEventListener('click',()=>{if(window.matchMedia('(max-width:900px)').matches)document.body.classList.toggle('trace-open');else document.body.classList.remove('trace-collapsed')});document.getElementById('trace-close').addEventListener('click',()=>{document.body.classList.remove('trace-open');if(!window.matchMedia('(max-width:900px)').matches)document.body.classList.add('trace-collapsed')});document.getElementById('sidebar-toggle').addEventListener('click',()=>{if(window.matchMedia('(max-width:680px)').matches)document.body.classList.toggle('sidebar-open');else document.body.classList.remove('sidebar-collapsed')});document.getElementById('sidebar-close').addEventListener('click',()=>{document.body.classList.remove('sidebar-open');if(!window.matchMedia('(max-width:680px)').matches)document.body.classList.add('sidebar-collapsed')});document.getElementById('logout').addEventListener('click',async()=>{if(source)stopGeneration();const response=await fetch('/auth/logout',{method:'POST',credentials:'same-origin'});if(response.ok)redirectToLogin()});
      fetch('/auth/me',{credentials:'same-origin'}).then(async response=>{if(response.status===401)return redirectToLogin();if(!response.ok)throw new Error('无法读取用户信息');const payload=await response.json(),email=payload.user.email;sidebarEmail.textContent=email;sidebarEmail.title=email;avatar.textContent=email.slice(0,1).toUpperCase()}).catch(()=>{status.textContent='用户状态异常';status.classList.add('offline')});
    })();
  </script>
</body>
</html>
